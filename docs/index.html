<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Compatibility</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script> <!-- add pyodide -->
</head>
<body>
    <h1>Spotify Compability Shit</h1>
    <p>Please have fun with my bullshit HAHAHAHAHA</p>

    <section id="upload">
        <div>
            <input type="text" id="nameA" placeholder="First persons name">
            <input type="file" id="zipA" accept=".zip">
        </div>
        <div>
            <input type="text" id="nameB" placeholder="Second persons name">
            <input type="file" id="zipB" accept=".zip">
        </div>
        <button id="loadBtn">Compare</button>
        <p id="status"></p>
    </section>

    <div class="layout">
        <nav>
            <button class="active" onclick="showTab('overview', this)">overview</button>
            <button onclick="showTab('artists', this)">Artists Tab</button>
            <button onclick="showTab('songs', this)">Songs tab</button>
            <button onclick="showTab('blendstats', this)">blend stats tab</button>
            <button onclick="showTab('blendfunny', this)">blend funny tab</button>
            <button onclick="showTab('habits', this)">habits tab</button>
        </nav>
        <main>
            <section id = "overview" class="tab">
                <h2>Overview tab</h2>
                <p>for the overview of the important stats</p>
            </section>
            <section id = "artists" class="tab hidden">
                <h2>Artists tab</h2>
                <p>for artists stats</p>
            </section>

            <section id = "songs" class="tab hidden">
                <h2>Songs tab</h2>
                <p>for song stats and lists</p>
                <div id="songsOutput"></div>
            </section>

            <section id = "blendstats" class="tab hidden">
                <h2>Blend stats tab</h2>
                <p>for blend stats</p>
            </section>
            <section id = "blendfunny" class="tab hidden">
                <h2>Blend funny tab</h2>
                <p>yea for funny</p>
            </section>
            <section id = "habits" class="tab hidden">
                <h2>Habits tab</h2>
                <p>for habits stats</p>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
